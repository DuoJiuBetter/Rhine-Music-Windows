[package]
name = "rhine-music-windows"
version = "0.1.0"
description = "Rhine Music Windows desktop port"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
open = "5"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
